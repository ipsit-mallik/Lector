<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tier 2 · Organise pages</title>
<script src="./dc-lite.js"></script>
</head>
<body>
<template data-dc>
<helmet>
<style>
body{margin:0}
.ib{width:32px;height:32px;border:0;padding:0;background:transparent;border-radius:6px;color:var(--ts);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .12s cubic-bezier(.2,.8,.2,1),color .12s cubic-bezier(.2,.8,.2,1)}
.ib:hover{background:var(--hover);color:var(--tp)}
.ib.on{background:var(--accentSoft);color:var(--accentStrong)}
.ib:disabled{color:var(--tt);background:transparent;cursor:default}
.rb{width:40px;height:40px;border:0;padding:0;background:transparent;border-radius:8px;color:var(--ts);display:flex;align-items:center;justify-content:center}
.tb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--tp);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background-color .12s cubic-bezier(.2,.8,.2,1)}
.tb svg{color:var(--ts)}
.tb:hover{background:var(--hover)}
.tb:disabled{color:var(--tt);cursor:default;background:transparent}
.tb:disabled svg{color:var(--tt)}
.tb.danger:hover:not(:disabled){color:var(--danger)}
.tb.danger:hover:not(:disabled) svg{color:var(--danger)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;background:transparent;border-radius:6px;font:inherit;font-size:13.5px;color:var(--tp);text-align:left;cursor:pointer;box-sizing:border-box}
.mi:hover{background:var(--hover)}
.mi svg{color:var(--ts);flex:none}
.btn{height:36px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:var(--onAccent);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accentHover)}
.btn.danger{background:var(--danger);color:var(--onAccent)}
.btn.danger:hover{background:var(--dangerHover)}
.btn2{height:36px;padding:0 14px;border:1px solid var(--borderStrong);border-radius:8px;background:var(--input);color:var(--tp);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.btn2:hover{background:var(--inputHover)}
.th{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 10px 8px;border:0;border-radius:10px;background:transparent;font:inherit;color:var(--ts);cursor:pointer;transition:background-color .12s cubic-bezier(.2,.8,.2,1)}
.th:hover{background:var(--hover)}
.th .paper{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s cubic-bezier(.2,.8,.2,1)}
.th:hover .paper{box-shadow:var(--shadow2)}
.th.sel{background:var(--selFill)}
.th.sel .num{color:var(--accentStrong);font-weight:600}
.th .hov{opacity:0;transition:opacity .12s}
.th:hover .hov{opacity:1}
.th.drag{opacity:.4}
.mini{width:28px;height:28px;border:0;border-radius:6px;background:var(--input);color:var(--ts);box-shadow:var(--shadow1),0 0 0 1px var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mini:hover{color:var(--tp)}
.mini.del:hover{color:var(--danger)}
.opt{display:flex;gap:12px;align-items:center;width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input);font:inherit;text-align:left;cursor:pointer;box-sizing:border-box;color:var(--tp)}
.opt:hover{border-color:var(--borderStrong)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--selFill)}
.field{height:36px;box-sizing:border-box;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--tp);font:inherit;font-size:13.5px}
.loc{display:flex;align-items:center;gap:8px;width:100%;height:36px;box-sizing:border-box;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--tp);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;transition:border-color .12s cubic-bezier(.2,.8,.2,1)}
.loc:hover{border-color:var(--borderStrong)}
.loc[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lmi{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:4px 10px;border:0;border-radius:6px;background:transparent;color:var(--tp);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;box-sizing:border-box}
.lmi:hover{background:var(--hover)}
.lmi[aria-selected="true"]{background:var(--accentSoft)}
.namebox{display:flex;align-items:center;min-width:0;height:36px;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;background:var(--input)}
.namebox:focus-within{outline:2px solid var(--accent);outline-offset:1px}
@keyframes up{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.upmenu{animation:up .14s cubic-bezier(.2,.8,.2,1);transform-origin:bottom left}
@media (prefers-reduced-motion: reduce){.upmenu{animation:none}}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
.tlink{border:0;background:transparent;padding:0 4px;height:28px;border-radius:6px;color:var(--toastAccent);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tlink:hover{text-decoration:underline}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.menu{animation:rise .14s cubic-bezier(.2,.8,.2,1);transform-origin:top right}
.card{animation:pop .2s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.menu,.card{animation:none}.th .paper{transition:none}}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 1280px; height: 800px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--tp); font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif; font-size: 13.5px;">

<sc-if value="{{reading}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
<div style="height: 48px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 24px 0 16px; background: var(--s1); border-bottom: 1px solid var(--border);">
<button class="ib" aria-label="Outline and pages"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><path d="M9 4.5v15"></path></svg></button>
<span style="font-size: 12.5px; color: var(--ts); padding: 0 8px;">‹ Library</span>
<span style="font-family: Charter, Georgia, serif; font-size: 15px;">Annual Report 2025</span>
<span style="flex: 1;"></span>
<span style="color: var(--tm); font-size: 13px;">Page 4 of 12</span>
<span style="width: 1px; height: 20px; background: var(--border); margin: 0 4px;"></span>
<span style="font-size: 13px; color: var(--tp); width: 76px; text-align: center;">100%</span>
<span style="width: 1px; height: 20px; background: var(--border); margin: 0 4px;"></span>
<button class="ib" aria-label="Focus mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
<button class="ib {{moreCls}}" onClick="{{toggleMenu}}" aria-label="More" aria-haspopup="menu" aria-expanded="{{menu}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="18.5" cy="12" r="1.7"></circle></svg></button>
</div>
<div style="flex: 1; min-height: 0; display: flex;">
<div style="flex: 1; display: flex; justify-content: center; padding-top: 24px; overflow: hidden;">
<div style="width: 520px; height: 736px; flex: none; background: var(--paper); box-shadow: var(--shadowPage); box-sizing: border-box; padding: 72px 64px; display: flex; flex-direction: column; gap: 12px;">
<div style="height: 14px; width: 52%; border-radius: 3px; background: var(--ink); opacity: .55; margin-bottom: 14px;"></div>
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="12"><div style="{{ln.s}}"></div></sc-for>
</div>
</div>
<div style="width: 56px; flex: none; background: var(--s1); border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--ts);">
<span class="rb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l5 5-9 9H6v-5z"></path><path d="M4 21h16"></path></svg></span>
<span class="rb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg></span>
<span class="rb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></span>
</div>
</div>
<sc-if value="{{menu}}" hint-placeholder-val="{{true}}">
<div class="menu" role="menu" aria-label="File" style="position: absolute; top: 52px; right: 16px; width: 272px; box-sizing: border-box; padding: 6px; border-radius: 12px; background: var(--input); box-shadow: var(--shadow3); border: 1px solid var(--edge); display: flex; flex-direction: column; gap: 2px; z-index: 5;">
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 4v5h7V4M8 20v-6h8v6"></path></svg><span style="flex: 1;">Save</span><span style="font-size: 12px; color: var(--tm);">Ctrl+S</span></button>
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1.5"></rect><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"></path></svg><span style="flex: 1;">Save a copy…</span><span style="font-size: 12px; color: var(--tm);">Ctrl+Shift+S</span></button>
<div style="height: 1px; background: var(--border); margin: 4px 6px;"></div>
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v6M9 6l3 3 3-3M12 21v-6M9 18l3-3 3 3M4 12h16"></path></svg><span style="flex: 1;">Compress…</span></button>
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H6v18h6"></path><path d="M13 3l5 5v3"></path><circle cx="16.5" cy="16.5" r="3.5"></circle><path d="M19 19l2.5 2.5"></path></svg><span style="flex: 1;">Make searchable…</span></button>
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 16l-5-5-9 8.5"></path></svg><span style="flex: 1;">Export as images…</span></button>
<div style="height: 1px; background: var(--border); margin: 4px 6px;"></div>
<button class="mi" role="menuitem" onClick="{{enter}}" style="background: var(--hover);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="7" rx="1"></rect><rect x="13.5" y="4" width="6.5" height="7" rx="1"></rect><rect x="4" y="13" width="6.5" height="7" rx="1"></rect><rect x="13.5" y="13" width="6.5" height="7" rx="1"></rect></svg><span style="flex: 1;">Organise pages…</span><span style="font-size: 12px; color: var(--tm);">Ctrl+Shift+O</span></button>
<div style="height: 1px; background: var(--border); margin: 4px 6px;"></div>
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5a1 1 0 011-1h5l2 2h8a1 1 0 011 1v9a1 1 0 01-1 1h-15a1 1 0 01-1-1z"></path></svg><span style="flex: 1;">Show in folder</span></button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{organising}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
<div style="height: 48px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--s1); border-bottom: 1px solid var(--border);">
<span style="width: 32px; height: 32px; border-radius: 8px; background: var(--accentSoft); color: var(--accentStrong); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="7" rx="1"></rect><rect x="13.5" y="4" width="6.5" height="7" rx="1"></rect><rect x="4" y="13" width="6.5" height="7" rx="1"></rect><rect x="13.5" y="13" width="6.5" height="7" rx="1"></rect></svg></span>
<span style="font-family: Charter, Georgia, serif; font-size: 17px;">Organise pages</span>
<span style="color: var(--tm); font-size: 13px;">Annual Report 2025</span>
<span style="flex: 1;"></span>
<button class="ib" onClick="{{undo}}" disabled="{{noUndo}}" aria-label="Undo" title="Undo (Ctrl+Z)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg></button>
<button class="ib" onClick="{{redo}}" disabled="{{noRedo}}" aria-label="Redo" title="Redo (Ctrl+Y)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 000 10h3"></path></svg></button>
<span style="width: 1px; height: 20px; background: var(--border); margin: 0 4px;"></span>
<button class="btn" onClick="{{exit}}" title="Back to reading (Esc)">Done</button>
</div>

<div style="height: 52px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--page);">
<button class="tb" onClick="{{rotL}}" disabled="{{none}}" title="{{whyOff}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v5h5"></path><path d="M4.5 9A8 8 0 1112 20"></path></svg>Rotate left</button>
<button class="tb" onClick="{{rotR}}" disabled="{{none}}" title="{{whyOff}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4v5h-5"></path><path d="M19.5 9A8 8 0 1012 20"></path></svg>Rotate right</button>
<button class="tb danger" onClick="{{del}}" disabled="{{none}}" title="{{whyOff}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg>Delete</button>
<span style="width: 1px; height: 20px; background: var(--border); margin: 0 8px;"></span>
<button class="tb" onClick="{{openExtract}}" disabled="{{none}}" title="{{whyOff}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a1 1 0 00-1 1v16a1 1 0 001 1h5"></path><path d="M14 3v4h4v3M15 17h7M19 14l3 3-3 3"></path></svg>Extract…</button>
<button class="tb" onClick="{{openInsert}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a1 1 0 00-1 1v16a1 1 0 001 1h10a1 1 0 001-1V7z"></path><path d="M14 3v4h4M12 11v6M9 14h6"></path></svg>Insert…</button>
<span style="flex: 1;"></span>
<span style="font-size: 13px; color: var(--ts); font-variant-numeric: tabular-nums;">{{selText}}</span>
<button class="tb" onClick="{{selAll}}">{{selAllLabel}}</button>
</div>

<div style="flex: 1; min-height: 0; overflow: auto; padding: 20px 28px; box-sizing: border-box;">

<button class="th {{c.cls}}" role="option" aria-selected="{{c.on}}" aria-label="{{c.label}}" onClick="{{c.click}}" draggable="true" onDragStart="{{c.dragStart}}" onDragOver="{{c.dragOver}}" onDrop="{{c.drop}}" onDragEnd="{{c.dragEnd}}" style="width: 100%;">

</span>

</button>

</sc-for>
</div>
</div>

</div>

</div>
<div style="padding: 20px 32px 24px; display: flex; flex-direction: column; gap: 14px;">

<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px 12px; align-items: center;">
<span style="font-size: 13px; color: var(--ts);">{{destNameLabel}}</span>
<div class="namebox"><input value="{{nameStem}}" onInput="{{onStem}}" aria-label="{{destNameLabel}}" spellcheck="false" style="flex: 1; min-width: 0; height: 34px; border: 0; background: transparent; padding: 0 10px; font: inherit; font-size: 13.5px; color: var(--tp); outline: none;"><sc-if value="{{hasExt}}" hint-placeholder-val="{{true}}"><span style="padding-right: 10px; color: var(--tm);">{{nameExt}}</span></sc-if></div>

        else this.setState({ dlg: null, toast: msg, toastUndo: false });
      },
      footText: s.pages.length + ' pages' + (s.changes ? ' · ' + s.changes + (s.changes === 1 ? ' unsaved change' : ' unsaved changes') : ''),
      toastOn: !!s.toast, toastText: s.toast || '', toastUndo: s.toastUndo && s.past.length > 0,
      hideToast: () => this.setState({ toast: null })
    };
  }
}
</script>
</body>
