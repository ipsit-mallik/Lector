<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tier 1 · Reader file tools</title>
<script src="./dc-lite.js"></script>
</head>
<body>
<template data-dc>
<helmet>
<style>
body{margin:0}
.ib{width:32px;height:32px;border:0;padding:0;background:transparent;border-radius:6px;color:var(--ts);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .12s cubic-bezier(.2,.8,.2,1),color .12s cubic-bezier(.2,.8,.2,1)}
.ib:hover{background:var(--hover);color:var(--tp)}
.ib.on{background:var(--accentSoft);color:var(--accentStrong)}
.rb{width:40px;height:40px;border:0;padding:0;background:transparent;border-radius:8px;color:var(--ts);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rb:hover{background:var(--hover);color:var(--tp)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;background:transparent;border-radius:6px;font:inherit;font-size:13.5px;color:var(--tp);text-align:left;cursor:pointer;box-sizing:border-box;transition:background-color .12s cubic-bezier(.2,.8,.2,1)}
.mi:hover{background:var(--hover)}
.mi svg{color:var(--ts);flex:none}
.btn{height:36px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:var(--onAccent);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:background-color .12s cubic-bezier(.2,.8,.2,1)}
.btn:hover{background:var(--accentHover)}
.btn2{height:36px;padding:0 14px;border:1px solid var(--borderStrong);border-radius:8px;background:var(--input);color:var(--tp);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:background-color .12s cubic-bezier(.2,.8,.2,1)}
.btn2:hover{background:var(--inputHover)}
.btn3{height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ts);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.btn3:hover{background:var(--hover);color:var(--tp)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input);font:inherit;text-align:left;cursor:pointer;box-sizing:border-box;color:var(--tp);transition:border-color .12s cubic-bezier(.2,.8,.2,1),background-color .12s cubic-bezier(.2,.8,.2,1)}
.opt:hover{border-color:var(--borderStrong)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--selFill)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:8px;background:var(--s1);border:1px solid var(--border)}
.sg{height:30px;padding:0 14px;border:0;border-radius:6px;background:transparent;color:var(--ts);font:inherit;font-size:13px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.sg:hover{color:var(--tp)}
.sg.sel{background:var(--input);color:var(--tp);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chipbtn{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:var(--input);color:var(--tp);font:inherit;font-size:12.5px;cursor:pointer}
.chipbtn:hover{border-color:var(--borderStrong)}
.tlink{border:0;background:transparent;padding:0 4px;height:28px;border-radius:6px;color:var(--toastAccent);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tlink:hover{text-decoration:underline}
.field{height:36px;box-sizing:border-box;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--tp);font:inherit;font-size:13.5px}
.loc{display:flex;align-items:center;gap:8px;width:100%;height:36px;box-sizing:border-box;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--tp);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;transition:border-color .12s cubic-bezier(.2,.8,.2,1)}
.loc:hover{border-color:var(--borderStrong)}
.loc[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lmi{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:4px 10px;border:0;border-radius:6px;background:transparent;color:var(--tp);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;box-sizing:border-box}
.lmi:hover{background:var(--hover)}
.lmi[aria-selected="true"]{background:var(--accentSoft)}
.namebox{display:flex;align-items:center;min-width:0;height:36px;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;background:var(--input)}
.namebox:focus-within{outline:2px solid var(--accent);outline-offset:1px}
@keyframes up{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.upmenu{animation:up .14s cubic-bezier(.2,.8,.2,1);transform-origin:bottom left}
@media (prefers-reduced-motion: reduce){.upmenu{animation:none}}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{animation:rise .14s cubic-bezier(.2,.8,.2,1);transform-origin:top right}
.card{animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.spin{animation:spin .9s linear infinite}
@media (prefers-reduced-motion: reduce){.menu,.card,.spin{animation:none}}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 1280px; height: 800px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--tp); font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif; font-size: 13.5px;">

<div style="height: 48px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 24px 0 16px; background: var(--s1); border-bottom: 1px solid var(--border);">
<button class="ib" aria-label="Outline and pages"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><path d="M9 4.5v15"></path></svg></button>
<button class="btn3" style="height: 36px; padding: 0 8px; display: flex; align-items: center; gap: 2px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Library</button>
<span style="font-family: Charter, Georgia, serif; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Annual Report 2025</span>
<span style="flex: 1;"></span>
<button class="ib" aria-label="Previous page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="width: 52px; height: 30px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; background: var(--input); display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;">34</span>
<span style="color: var(--tm); font-size: 13px;">of 120</span>
<button class="ib" aria-label="Next page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<span style="width: 1px; height: 20px; background: var(--border); margin: 0 4px;"></span>
<button class="ib" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
<button class="btn3" style="width: 76px; height: 32px; padding: 0; font-variant-numeric: tabular-nums; color: var(--tp);">100%</button>
<button class="ib" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg></button>
<span style="width: 1px; height: 20px; background: var(--border); margin: 0 4px;"></span>
<button class="ib" aria-label="Focus mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
<button class="ib {{moreCls}}" onClick="{{toggleMenu}}" aria-label="More" aria-haspopup="menu" aria-expanded="{{menu}}" title="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="18.5" cy="12" r="1.7"></circle></svg></button>
</div>

<div style="flex: 1; min-height: 0; display: flex;">
<div style="width: 14px; flex: none; display: flex; justify-content: center; padding: 10px 0; box-sizing: border-box;">
<div style="width: 6px; height: 100%; border-radius: 3px; background: var(--track); position: relative; overflow: hidden; opacity: .55;">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 28%; background: var(--progressFill);"></div>
</div>
</div>
<div style="flex: 1; min-width: 0; display: flex; justify-content: center; padding-top: 24px; overflow: hidden;">
<div style="width: 520px; height: 736px; flex: none; background: var(--paper); box-shadow: var(--shadowPage); box-sizing: border-box; padding: 72px 64px; display: flex; flex-direction: column; gap: 12px;">
<div style="height: 14px; width: 58%; border-radius: 3px; background: var(--ink); opacity: .55; margin-bottom: 14px;"></div>
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="14">
<div style="{{ln.s}}"></div>
</sc-for>
</div>
</div>
<div style="width: 56px; flex: none; background: var(--s1); border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
<button class="rb" aria-label="Highlight"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l5 5-9 9H6v-5z"></path><path d="M4 21h16"></path></svg></button>
<span style="width: 22px; height: 4px; border-radius: 2px; background: #F7DE7A; margin: -2px 0 2px;"></span>
<button class="rb" aria-label="Undo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg></button>
<button class="rb" aria-label="Redo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 000 10h3"></path></svg></button>
<button class="rb" aria-label="Find in document"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></button>
<span style="width: 24px; height: 1px; background: var(--border); margin: 8px 0;"></span>
<button class="rb" aria-label="Book layout" style="background: var(--accentSoft); color: var(--accentStrong);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1V19c-3-1-6-1-9 1-3-2-6-2-9-1z"></path><path d="M12 6.5V20"></path></svg></button>
<button class="rb" aria-label="Cycle theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 000 16z" fill="currentColor"></path></svg></button>
</div>
</div>

<div style="height: 44px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--s1); border-top: 1px solid var(--border);">
<span style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--input); font-size: 12.5px; color: var(--ts);"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--tt);"></span>Mic idle</span>
<span style="font-size: 12.5px; color: var(--tm);">Hold Space to talk</span>
<span style="flex: 1;"></span>
<sc-if value="{{showChip}}" hint-placeholder-val="{{false}}">
<button class="chipbtn" onClick="{{reopen}}" title="Show progress">
<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="var(--border)"></circle><path d="M12 3a9 9 0 019 9" stroke="var(--accent)" stroke-linecap="round"></path></svg>
<span>{{chipText}}</span>
</button>
</sc-if>
<span style="font-size: 12.5px; color: var(--tm);">3 highlights on this page</span>
<button class="btn2" style="height: 30px; font-size: 12.5px;">What can I say?</button>
</div>

<sc-if value="{{menu}}" hint-placeholder-val="{{true}}">
<div class="menu" role="menu" aria-label="File" style="position: absolute; top: 52px; right: 16px; width: 272px; box-sizing: border-box; padding: 6px; border-radius: 12px; background: var(--input); box-shadow: var(--shadow3); border: 1px solid var(--edge); display: flex; flex-direction: column; gap: 2px; z-index: 5;">
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 4v5h7V4M8 20v-6h8v6"></path></svg><span style="flex: 1;">Save</span><span style="font-size: 12px; color: var(--tm);">Ctrl+S</span></button>
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1.5"></rect><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"></path></svg><span style="flex: 1;">Save a copy…</span><span style="font-size: 12px; color: var(--tm);">Ctrl+Shift+S</span></button>
<div style="height: 1px; background: var(--border); margin: 4px 6px;"></div>
<button class="mi" role="menuitem" onClick="{{openCompress}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v6M9 6l3 3 3-3M12 21v-6M9 18l3-3 3 3M4 12h16"></path></svg><span style="flex: 1;">Compress…</span></button>
<button class="mi" role="menuitem" onClick="{{openSearch}}" style="height: 48px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H6v18h6"></path><path d="M13 3l5 5v3"></path><circle cx="16.5" cy="16.5" r="3.5"></circle><path d="M19 19l2.5 2.5"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px;"><span>Make searchable…</span><span style="font-size: 12px; color: var(--tm);">42 pages have no text</span></span></button>
<button class="mi" role="menuitem" onClick="{{openExport}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 16l-5-5-9 8.5"></path></svg><span style="flex: 1;">Export as images…</span></button>
<div style="height: 1px; background: var(--border); margin: 4px 6px;"></div>
<button class="mi" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5a1 1 0 011-1h5l2 2h8a1 1 0 011 1v9a1 1 0 01-1 1h-15a1 1 0 01-1-1z"></path></svg><span style="flex: 1;">Show in folder</span></button>
</div>
</sc-if>

<sc-if value="{{dlgOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 10;">
<div class="card" role="dialog" aria-modal="true" aria-labelledby="dt" style="width: 520px; box-sizing: border-box; border-radius: 16px; background: var(--s2); box-shadow: var(--shadow3), var(--dialogEdge); overflow: visible; display: flex; flex-direction: column;">
<div style="padding: 24px 32px 0; display: flex; gap: 14px; align-items: flex-start;">
<div style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--accentSoft); color: var(--accentStrong); display: flex; align-items: center; justify-content: center;">
<sc-if value="{{isC}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v6M9 6l3 3 3-3M12 21v-6M9 18l3-3 3 3M4 12h16"></path></svg></sc-if>
<sc-if value="{{isS}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H6v18h6"></path><path d="M13 3l5 5v3"></path><circle cx="16.5" cy="16.5" r="3.5"></circle><path d="M19 19l2.5 2.5"></path></svg></sc-if>
<sc-if value="{{isE}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 16l-5-5-9 8.5"></path></svg></sc-if>
</div>
<div style="flex: 1; min-width: 0;">
<p id="dt" style="margin: 0; font-family: Charter, Georgia, serif; font-size: 22px; line-height: 28px;">{{title}}</p>
<p style="margin: 4px 0 0; font-size: 13.5px; line-height: 20px; color: var(--ts);">{{desc}}</p>
</div>
</div>

<div style="padding: 20px 32px 24px; display: flex; flex-direction: column; gap: 16px;">

<sc-if value="{{cSetup}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; gap: 8px; font-size: 12.5px; color: var(--tm);"><span>Now <b style="color: var(--tp); font-weight: 600;">24.6 MB</b></span><span>·</span><span>120 pages</span><span>·</span><span>96 images</span></div>
<div role="radiogroup" aria-label="Level" style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{levels}}" as="o" hint-placeholder-count="3">
<button class="opt {{o.cls}}" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}">
<span style="{{o.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1;">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 600;">{{o.t}}<sc-if value="{{o.rec}}" hint-placeholder-val="{{false}}"><span style="font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accentSoft); color: var(--accentStrong);">Recommended</span></sc-if></span>
<span style="font-size: 12.5px; line-height: 18px; color: var(--ts);">{{o.d}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{sSetup}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 8px; background: var(--input); border: 1px solid var(--border);">
<div style="font-family: Charter, Georgia, serif; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;">42</div>
<div style="font-size: 13px; line-height: 19px; color: var(--ts);">of 120 pages are pictures of text, so they can't be searched or selected yet. The other 78 already have text and are left as they are.</div>
</div>
<div role="radiogroup" aria-label="Pages" style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{sOpts}}" as="o" hint-placeholder-count="2">
<button class="opt {{o.cls}}" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="padding: 10px 14px; align-items: center;">
<span style="{{o.dot}}"></span>
<span style="flex: 1; font-weight: 500;">{{o.t}}</span>
<span style="font-size: 12.5px; color: var(--tm);">{{o.d}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px;"><span style="color: var(--ts);">Language</span><span>English <span style="color: var(--tm);">· read on this computer</span></span></div>
</div>
</sc-if>

<sc-if value="{{eSetup}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: grid; grid-template-columns: 96px 1fr; row-gap: 14px; align-items: center;">
<span style="color: var(--ts);">Format</span>
<div style="display: flex; align-items: center; gap: 12px;">
<div class="seg" role="radiogroup" aria-label="Format">
<button class="sg {{pngCls}}" role="radio" aria-checked="{{isPng}}" onClick="{{pickPng}}">PNG</button>
<button class="sg {{jpgCls}}" role="radio" aria-checked="{{isJpg}}" onClick="{{pickJpg}}">JPEG</button>
</div>
<span style="font-size: 12.5px; color: var(--tm);">{{fmtHint}}</span>
</div>
<span style="color: var(--ts);">Resolution</span>
<div style="display: flex; align-items: center; gap: 12px;">
<div class="seg" role="radiogroup" aria-label="Resolution">

      pickPng: () => this.setState({ fmt: 'png' }), pickJpg: () => this.setState({ fmt: 'jpg' }),
      fmtHint: s.fmt === 'png' ? 'Sharp text, larger files' : 'Smaller files, best for photos',
      ppis: [96, 150, 300].map((v) => ({ t: v + ' ppi', on: s.ppi === v, cls: s.ppi === v ? 'sel' : '', pick: () => this.setState({ ppi: v }) })),
      pxHint: px + ' a page',
      saveLabel: isE ? 'Save to folder' : 'Save as',
      outName: isC ? 'Annual Report 2025 (compressed).pdf' : isS ? 'Annual Report 2025 (searchable).pdf' : 'Annual Report 2025 (images)',
      outHint: isE ? 'Files are named Annual Report 2025-p001.' + (s.fmt === 'png' ? 'png' : 'jpg') + ', -p002 and so on.' : 'In D:\\Reports, beside the original.',
      showNotes: setup && !isE ? true : (setup && isE && this.props.unsavedHighlights),
      unsaved: !!this.props.unsavedHighlights,
      signed: !!this.props.signedPdf && setup && !isE,
      primary: isC ? 'Compress' : isS ? 'Make searchable' : ('Export ' + n + (n === 1 ? ' image' : ' images')),
      start: () => { if (isE && n === 0) return; this.run(s.dlg); },
      close: () => { clearInterval(this.timer); this.setState({ dlg: null, phase: 'setup', locOpen: false, loc: 'orig' }); },
      cancelJob: () => { clearInterval(this.timer); this.setState({ phase: 'setup', prog: 0 }); },
      keepReading: () => this.setState({ bgJob: s.dlg, dlg: null }),
      reopen: () => this.setState({ dlg: s.bgJob, bgJob: null }),
      tryStrong: () => { this.setState({ level: 'strong', forceStrong: true }); this.run('compress'); },
      workText: workTexts[s.dlg] || '', pct: pct + '%',
      barStyle: 'height: 100%; border-radius: 3px; background: var(--accent); width: ' + pct + '%; transition: width .06s linear;',
      eDoneText: n + (n === 1 ? ' image exported.' : ' images exported.'),
      showFolderBtn: !(isC && compactRes) && !isS,
      showOpenBtn: (isC && !compactRes) || isS,
      showChip: !!s.bgJob, chipText: chipTexts[s.bgJob] || '',
      toastOn: !!s.toast, toastText: toastTexts[s.toast] || '',
      hideToast: () => this.setState({ toast: null }),
      lines: widths.map((w) => ({ s: w === 0 ? 'height: 10px;' : 'height: 8px; border-radius: 3px; background: var(--line); width: ' + w + '%;' }))
    };
  }
}
</script>
</body>
