<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.dataset.theme = localStorage.getItem("lector-theme") || "light";</script>
  <title>Lector — Home</title>
  <link rel="stylesheet" href="pages/home.css">
</head>
<body>
  <div class="home-view">
    <div class="sidebar">
      <div class="brand">
        <div class="brand-mark" data-icon="logo"></div>
        <span class="brand-name">Lector</span>
      </div>
      <button class="nav-item active">
        <span data-icon="recent"></span> Recent
      </button>
      <button class="nav-item" disabled>
        <span data-icon="all_pdfs"></span> All PDFs
      </button>
      <button class="nav-item" disabled>
        <span data-icon="favorites"></span> Favorites
      </button>
      <button class="nav-item" id="settingsNav">
        <span data-icon="settings"></span> Settings
      </button>
      <div class="sidebar-fill"></div>
      <div class="voice-box" id="voiceBox">
        <div class="voice-status">
          <span class="voice-dot"></span>
          <span id="voiceState">VOICE READY</span>
        </div>
        <p id="voiceDetail">Hold Space and say what you want. Offline — nothing leaves this machine.</p>
      </div>
    </div>

    <div class="content themed-scroll">
      <div class="top-row">
        <input class="search-input" type="text" placeholder="Search your library" aria-label="Search your library">
        <button class="btn" id="openPdfBtn">
          <span data-icon="open_pdf"></span>
          Open PDF
        </button>
      </div>

      <div class="recent-heading">
        <h2>RECENT</h2>
        <span id="recentCount" class="count-empty">no files yet</span>
        <div class="recent-heading-fill"></div>
        <div class="view-toggle" role="group" aria-label="Recent view">
          <button class="view-toggle-btn" id="recentViewGridBtn" aria-pressed="true" aria-label="Grid view" title="Grid view">
            <span data-icon="grid_view"></span>
          </button>
          <button class="view-toggle-btn" id="recentViewListBtn" aria-pressed="false" aria-label="List view" title="List view">
            <span data-icon="list_view"></span>
          </button>
        </div>
      </div>

      <div id="recentArea"></div>
    </div>
  </div>

  <!-- In-app Open dialog (Milestone 8.7), replacing the native file chooser
       the voice router could not see. Every row is numbered for the whole
       time this is open — see frontend/js/file-browser.js's header comment
       for why, unlike the Recent grid's opt-in picker toggle above. -->
  <div class="dialog-scrim voice-dialog" id="openDialogScrim" hidden>
    <div class="dialog-card dialog-card--wide">
      <div class="dialog-body dialog-body--browser">
        <div class="dialog-header">
          <div class="dialog-badge" data-icon="folder"></div>
          <p class="dialog-title">Open PDF</p>
        </div>
      </div>
      <div class="browser-crumbs" id="openDialogPath"></div>
      <div class="browser-panes">
        <div class="browser-side themed-scroll">
          <p class="browser-side-label">Quick access</p>
          <div class="browser-quick" id="openDialogQuick"></div>
          <p class="browser-side-label">This PC</p>
          <div class="browser-tree" id="openDialogTree" role="tree"></div>
        </div>
        <div class="browser-main">
          <div class="browser-search">
            <span data-icon="search"></span>
            <input type="text" id="openDialogSearch" placeholder="Search this folder…" autocomplete="off" aria-label="Search this folder">
          </div>
          <div class="browser-list themed-scroll" id="openDialogList"></div>
        </div>
      </div>
      <div class="dialog-footer">
        <span class="hint">Click a folder or PDF, or say its number, or "home" / "desktop" / "documents" / "downloads".</span>
        <button class="btn btn-secondary" id="openDialogCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Remove-from-Recent confirmation (Milestone 8.9). Reuses the
       .dialog-scrim/.dialog-card frame verbatim (docs/DESIGN_SYSTEM.md's
       "Remove-from-Recent affordance") — list-entry removal only, the
       underlying PDF is never touched. -->
  <div class="dialog-scrim voice-dialog" id="removeConfirmScrim" hidden>
    <div class="dialog-card">
      <div class="dialog-body">
        <div class="dialog-header">
          <div class="dialog-badge" data-icon="remove"></div>
          <div>
            <p class="dialog-title">Remove from Recent?</p>
            <p class="dialog-desc" id="removeConfirmDesc"></p>
          </div>
        </div>
      </div>
      <div class="dialog-footer">
        <span class="hint">The file itself is never touched.</span>
        <button class="btn btn-secondary" id="removeConfirmCancelBtn">Cancel</button>
        <button class="btn" id="removeConfirmRemoveBtn">Remove</button>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/file-browser.js"></script>
  <script src="pages/home.js"></script>
</body>
</html>
