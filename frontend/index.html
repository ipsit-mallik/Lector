<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Lector — Home</title>
  <link rel="stylesheet" href="pages/home.css">
</head>
<body>
  <div class="home-view">
    <div class="sidebar">
      <!-- The sidebar's icons are in the markup, not fetched by icons.js, so they are
           on the page's very first frame: this page replaces another one on every
           sidebar click, and slots that filled in 100-280ms later read as a flicker.
           frontend/shared/icons/ stays the source; a test pins these to it. -->
      <div class="brand">
        <div class="brand-mark" data-icon="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="8" y="3" width="6" height="10" rx="3"></rect><path d="M5 11a6 6 0 0 0 12 0"></path><line x1="11" y1="17" x2="11" y2="20"></line></svg></div>
        <span class="brand-name">Lector</span>
      </div>
      <button class="nav-item active" id="recentNav" aria-current="page">
        <span data-icon="recent"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><polyline points="11,6.5 11,11 14.5,13"></polyline></svg></span> Recent
      </button>
      <button class="nav-item" disabled>
        <span data-icon="all_pdfs"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="6.5" height="6.5"></rect><rect x="12" y="3.5" width="6.5" height="6.5"></rect><rect x="3.5" y="12" width="6.5" height="6.5"></rect><rect x="12" y="12" width="6.5" height="6.5"></rect></svg></span> All PDFs
      </button>
      <button class="nav-item" id="favoritesNav">
        <span data-icon="favorites"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><polygon points="11,3 13.5,8.2 19,9 15,12.9 16,18.5 11,15.8 6,18.5 7,12.9 3,9 8.5,8.2"></polygon></svg></span> Favorites
      </button>
      <button class="nav-item" id="settingsNav">
        <span data-icon="settings"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.6"></circle><circle cx="11" cy="11" r="2.4"></circle><line x1="11" y1="1.8" x2="11" y2="4"></line><line x1="11" y1="18" x2="11" y2="20.2"></line><line x1="1.8" y1="11" x2="4" y2="11"></line><line x1="18" y1="11" x2="20.2" y2="11"></line></svg></span> Settings
      </button>
      <div class="sidebar-fill"></div>
      <!-- Starts as "checking", not "ready": it only says ready once the speech
           engine has answered and Home's voice commands are actually active
           (frontend/js/voice-box.js). -->
      <div class="voice-box starting" id="voiceBox">
        <div class="voice-status">
          <span class="voice-dot"></span>
          <span id="voiceState">CHECKING VOICE</span>
        </div>
        <p id="voiceDetail">Starting the speech engine…</p>
        <!-- The one screen-reader announcement for the box: a short summary per
             state change (voice-box.js), since the visible text above changes
             with every partial transcript and must not itself be live. -->
        <span class="sr-only" id="voiceLive" role="status" aria-atomic="true"></span>
        <button class="voice-help-btn" id="voiceHelpBtn" type="button">What can I say?</button>
      </div>
    </div>

    <div class="content home-content page-enter">
      <!-- One header row per page: title and count on the left; search, the
           grid/list toggle and Open PDF on the right, in that order. Each
           control hides with `.is-absent` (visibility, never display), so its
           slot stays reserved and nothing moves when it comes or goes. -->
      <header class="page-header">
        <h1 class="page-title" id="sectionTitle">Recent</h1>
        <!-- Announced politely, so a search narrowing the list ("3 of 12") is
             heard as well as seen. Empty until the list has loaded: the backend
             takes a moment to build the thumbnails, and "no files yet" before it
             answers would be a claim nobody has checked. -->
        <span id="recentCount" class="page-count" role="status"></span>
        <!-- The search opens leftwards over this spacer from its icon, so nothing
             beside it moves (shared/library-header.css). -->
        <div class="page-header-fill">
          <div class="header-search is-absent" id="headerSearch" role="search">
            <input type="text" id="headerSearchInput" autocomplete="off" spellcheck="false"
                   placeholder="Search Recent" aria-label="Search Recent">
            <button class="header-search-clear" id="headerSearchClear" type="button"
                    aria-label="Clear search" title="Clear search" hidden>
              <span data-icon="close"></span>
            </button>
            <button class="header-search-toggle" id="headerSearchToggle" type="button"
                    aria-label="Search Recent" aria-expanded="false" aria-controls="headerSearchInput"
                    title="Search  (Ctrl+F)">
              <span data-icon="search"></span>
            </button>
          </div>
        </div>
        <div class="view-toggle is-absent" id="viewToggle" role="group" aria-label="Recent view">
          <button class="view-toggle-btn" id="recentViewGridBtn" aria-pressed="true" aria-label="Grid view" title="Grid view">
            <span data-icon="grid_view"></span>
          </button>
          <button class="view-toggle-btn" id="recentViewListBtn" aria-pressed="false" aria-label="List view" title="List view">
            <span data-icon="list_view"></span>
          </button>
        </div>
        <button class="btn header-open-btn is-absent" id="openPdfBtn" title="Open PDF  (Ctrl+O)">
          <span data-icon="open_pdf"></span>
          Open PDF
        </button>
        <!-- Settings' Favorites item arrives with a one-shot note in sessionStorage.
             This applies it before the first paint: the scripts at the bottom
             load after the browser has already drawn this markup, so home.js
             alone showed one frame of Recent (and Open PDF's slot) and then
             faded the sidebar highlight across to Favorites. It sits after the
             last header control so everything it changes already exists. home.js
             still owns the page from here (it applies the same state, and clears
             the note). -->
        <script>
          if (sessionStorage.getItem("lector-home-section") === "favorites") {
            const recentNav = document.getElementById("recentNav");
            const favoritesNav = document.getElementById("favoritesNav");
            recentNav.classList.remove("active");
            recentNav.removeAttribute("aria-current");
            favoritesNav.classList.add("active");
            favoritesNav.setAttribute("aria-current", "page");
            document.getElementById("sectionTitle").textContent = "Favorites";
            document.getElementById("openPdfBtn").hidden = true;
          }
        </script>
        <!-- Fades the sidebar highlight across from the page the reader just left
             (home.css .nav-arriving/.nav-leaving). After the hand-off above, so it
             sees the item that ends up lit, and before the first paint; Settings
             has the same script (a test pins the two equal). The note is left on
             pagehide, so every way of leaving counts, and is honoured only while
             fresh, so coming back from the reader later doesn't replay an old
             move. -->
        <script>
          (() => {
            const NOTE_KEY = "lector-nav-from";
            const NOTE_FRESH_MS = 2000;
            const activeNavItem = () => document.querySelector(".sidebar .nav-item.active");
            let note = null;
            try {
              note = JSON.parse(sessionStorage.getItem(NOTE_KEY));
            } catch (err) {
              note = null;
            }
            sessionStorage.removeItem(NOTE_KEY);
            const arriving = activeNavItem();
            const leaving = note && note.id ? document.getElementById(note.id) : null;
            if (arriving && leaving && leaving !== arriving && Date.now() - note.at < NOTE_FRESH_MS) {
              [[arriving, "nav-arriving"], [leaving, "nav-leaving"]].forEach(([item, cls]) => {
                item.classList.add(cls);
                item.addEventListener("animationend", () => item.classList.remove(cls), { once: true });
              });
            }
            addEventListener("pagehide", () => {
              const item = activeNavItem();
              sessionStorage.setItem(NOTE_KEY, JSON.stringify({ id: item ? item.id : null, at: Date.now() }));
            });
          })();
        </script>
      </header>

      <!-- Placeholder cards until the list arrives (home.js's renderRecent()
           replaces them, or buildLoadFailedState() if the load fails). Drawn here
           rather than by script so they are on the very first paint. Hidden from
           assistive tech; the sr-only line says what is happening instead. -->
      <div id="recentArea" aria-busy="true">
        <span class="sr-only">Loading your files…</span>
        <div class="recent-grid" aria-hidden="true">
          <div class="recent-card recent-card--skeleton">
            <div class="skeleton skeleton-thumb"></div>
            <div class="skeleton skeleton-line skeleton-title"></div>
            <div class="skeleton skeleton-line skeleton-meta"></div>
          </div>
          <div class="recent-card recent-card--skeleton">
            <div class="skeleton skeleton-thumb"></div>
            <div class="skeleton skeleton-line skeleton-title"></div>
            <div class="skeleton skeleton-line skeleton-meta"></div>
          </div>
          <div class="recent-card recent-card--skeleton">
            <div class="skeleton skeleton-thumb"></div>
            <div class="skeleton skeleton-line skeleton-title"></div>
            <div class="skeleton skeleton-line skeleton-meta"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- In-app Open dialog (Milestone 8.7), replacing the native file chooser
       the voice router could not see. Every row is numbered for the whole
       time this is open — see frontend/js/file-browser.js's header comment
       for why, unlike the Recent grid's opt-in picker toggle above. -->
  <div class="dialog-scrim voice-dialog" id="openDialogScrim" hidden>
    <div class="dialog-card dialog-card--wide">
      <div class="dialog-body dialog-body--browser">
        <div class="dialog-header">
          <div class="dialog-badge" data-icon="folder"></div>
          <p class="dialog-title">Open PDF</p>
        </div>
      </div>
      <div class="browser-crumbs" id="openDialogPath"></div>
      <div class="browser-panes">
        <div class="browser-side">
          <p class="browser-side-label">Quick access</p>
          <div class="browser-quick" id="openDialogQuick"></div>
          <p class="browser-side-label">This PC</p>
          <div class="browser-tree" id="openDialogTree" role="tree"></div>
        </div>
        <div class="browser-main">
          <div class="browser-search">
            <span data-icon="search"></span>
            <input type="text" id="openDialogSearch" placeholder="Search this folder…" autocomplete="off" aria-label="Search this folder">
          </div>
          <div class="browser-list" id="openDialogList"></div>
        </div>
      </div>
      <div class="dialog-footer">
        <span class="hint">Click a folder or PDF, or say its number, or "home" / "desktop" / "documents" / "downloads".</span>
        <button class="btn btn-secondary" id="openDialogCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Remove-from-Recent confirmation (Milestone 8.9). Reuses the
       .dialog-scrim/.dialog-card frame verbatim (docs/DESIGN_SYSTEM.md's
       "Remove-from-Recent affordance") — list-entry removal only, the
       underlying PDF is never touched. -->
  <div class="dialog-scrim voice-dialog" id="removeConfirmScrim" hidden>
    <div class="dialog-card">
      <div class="dialog-body">
        <div class="dialog-header">
          <div class="dialog-badge" data-icon="remove"></div>
          <div>
            <p class="dialog-title">Remove from Recent?</p>
            <p class="dialog-desc" id="removeConfirmDesc"></p>
          </div>
        </div>
      </div>
      <div class="dialog-footer">
        <span class="hint">The file itself is never touched.</span>
        <button class="btn btn-secondary" id="removeConfirmCancelBtn">Cancel</button>
        <button class="btn" id="removeConfirmRemoveBtn">Remove</button>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scrollbars.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/voice-box.js"></script>
  <script src="js/filedrop.js"></script>
  <script src="js/file-browser.js"></script>
  <script src="pages/recent-list.js"></script>
  <script src="pages/library-search.js"></script>
  <script src="pages/recent-card.js"></script>
  <script src="pages/command-reference.js"></script>
  <script src="pages/home.js"></script>
</body>
</html>
